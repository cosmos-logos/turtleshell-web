  <!-- Structured Data: Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "TurtleShell.ai",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web, iOS",
    "description": "Sovereign AI assistant built on Olympus-Grid. Multi-LLM chat, MCP enterprise tools, agent memory, metered billing. iOS, web, and off-grid.",
    "url": "https://turtleshell.ai",
    "offers": [
      { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD", "description": "500 Sea Shells / month" },
      { "@type": "Offer", "name": "Beachcomber", "price": "4.99", "priceCurrency": "USD", "description": "500 Sea Shells / month" },
      { "@type": "Offer", "name": "Tide", "price": "14.99", "priceCurrency": "USD", "description": "2,000 Sea Shells / month" },
      { "@type": "Offer", "name": "Reef", "price": "39.99", "priceCurrency": "USD", "description": "10,000 Sea Shells / month" },
      { "@type": "Offer", "name": "Abyss", "price": "99.99", "priceCurrency": "USD", "description": "100,000 Sea Shells / month" }
    ],
    "creator": { "@type": "Organization", "name": "CloudPremise LLC", "url": "https://www.olympus-grid.com" },
    "sameAs": ["https://www.olympus-grid.com", "https://github.com/cosmos-logos"]
  }
  </script>

  <!-- Structured Data: FAQ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "What is TurtleShell.ai?", "acceptedAnswer": { "@type": "Answer", "text": "TurtleShell.ai is a sovereign AI assistant that routes your conversations to the best available LLM (OpenAI, Claude, Gemini, Grok) and connects 50+ enterprise tools via the Model Context Protocol (MCP). Available on iOS, web, and Salesforce." }},
      { "@type": "Question", "name": "Is TurtleShell.ai free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. The Free tier provides 500 Sea Shells per month at no cost. Paid tiers (Beachcomber through Abyss) offer more shells and features starting at $4.99/month." }},
      { "@type": "Question", "name": "What are Sea Shells?", "acceptedAnswer": { "@type": "Answer", "text": "Sea Shells are the metering currency of TurtleShell.ai. One shell is consumed per chat turn, tool call, or memory write. Infrastructure events like page loads cost zero shells." }},
      { "@type": "Question", "name": "Is my data private?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Your data lives in your Salesforce org and your infrastructure — never on shared compute. TurtleShell.ai is built on Olympus-Grid, a sovereign AI infrastructure platform with zero standing access to customer data." }},
      { "@type": "Question", "name": "What is the 7% tithe?", "acceptedAnswer": { "@type": "Answer", "text": "Every TurtleShell.ai transaction tithes 7% to the user's chosen cause (Clean Energy, Clean Water, Education, Ocean Health, Sovereign Tech, Food Security, or AI for All) via the Olympus Foundation." }}
    ]
  }
  </script>
