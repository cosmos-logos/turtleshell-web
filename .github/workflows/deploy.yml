name: Deploy to Netlify

on:
  push:
    branches: [brain/1.7.x.x]
  pull_request:
    branches: [brain/1.7.x.x]
  repository_dispatch:
    types: [installer-updated]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run build

      # Production deploy — only on push to main branch
      - name: Deploy to production
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        run: npx netlify-cli deploy --dir=dist --prod --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      # Preview deploy — on pull requests
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          OUTPUT=$(npx netlify-cli deploy --dir=dist --site=${{ secrets.NETLIFY_SITE_ID }} --json)
          PREVIEW_URL=$(echo "$OUTPUT" | jq -r '.deploy_url')
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      # Comment preview URL on PR
      - name: Comment preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const body = `## Netlify Preview\n\n🔗 **Preview:** ${url}\n\nThis preview will be updated on each push to this PR.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('## Netlify Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
